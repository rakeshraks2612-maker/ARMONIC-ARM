[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "armonic-arm"
version = "1.0.0"
description = "Autonomous closed-loop AI performance optimization agent for Arm64"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Rakesh", email = "rakesh@armonic.dev"}
]
keywords = ["arm64", "optimization", "ai", "profiling", "performix", "agentic", "cloud"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: System :: Hardware",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "google-genai>=1.0.0",
    "PyYAML>=6.0",
    "GitPython>=3.1.0",
    "requests>=2.31.0",
    "pytest>=8.0.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
]

[project.scripts]
armonic = "armonic.run:main"

[project.urls]
Homepage = "https://github.com/rakeshraks2612-maker/ARMONIC-ARM"
Repository = "https://github.com/rakeshraks2612-maker/ARMONIC-ARM"
