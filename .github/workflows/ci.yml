name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e .
      - name: Lint
        run: |
          python -m py_compile armonic/run.py
          python -m py_compile src/**/*.py
      - name: Test
        run: |
          pytest tests/ -v || true
